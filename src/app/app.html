<div class="shell" [class.bare]="!auth.isAuthenticated()">
  @if (auth.currentUser(); as user) {
    <aside class="sidebar">
      <a class="brand" routerLink="/dashboard" aria-label="Finanças - início">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V9M10 19V5M16 19v-8M22 19H2" /></svg>
        </span>
        <span class="brand-name">Finanças</span>
      </a>

      <nav class="nav" aria-label="Principal">
        @for (item of nav; track item.path) {
          <a class="nav-link" [routerLink]="item.path" routerLinkActive="active">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path [attr.d]="item.icon" /></svg>
            <span>{{ item.label }}</span>
          </a>
        }
      </nav>

      <div class="sidebar-foot">
        <button type="button" class="btn btn-ghost btn-sm" (click)="themeService.toggle()" [attr.aria-label]="themeService.theme() === 'dark' ? 'Ativar tema claro' : 'Ativar tema escuro'">
          {{ themeService.theme() === 'dark' ? '☀ Claro' : '☾ Escuro' }}
        </button>
        <div class="user">
          <span class="avatar" aria-hidden="true">{{ initials(user.name) }}</span>
          <span class="user-info">
            <b>{{ user.name }}</b>
            <small>{{ user.email }}</small>
          </span>
          <button type="button" class="btn btn-ghost btn-sm" (click)="auth.logout()" aria-label="Sair">Sair</button>
        </div>
      </div>
    </aside>
  }
  <main class="content" id="conteudo">
    <router-outlet />
  </main>
</div>
