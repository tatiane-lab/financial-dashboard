<div class="login-page">
  <button type="button" class="btn btn-ghost btn-sm login-theme" (click)="themeService.toggle()">
    {{ themeService.theme() === 'dark' ? '☀ Claro' : '☾ Escuro' }}
  </button>

  <section class="login-card card" aria-labelledby="login-title">
    <div class="brand login-brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V9M10 19V5M16 19v-8M22 19H2" /></svg>
      </span>
      <span class="brand-name">Finanças</span>
    </div>
    <h1 id="login-title">Bem-vinda de volta</h1>
    <p class="muted">Acesse o painel financeiro da sua empresa.</p>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="field">
        <label for="email">E-mail</label>
        <input id="email" type="email" formControlName="email" autocomplete="username" placeholder="voce@empresa.com.br"
          [attr.aria-invalid]="error('email') ? true : null" />
        @if (error('email'); as msg) { <small class="field-error">{{ msg }}</small> }
      </div>

      <div class="field">
        <label for="password">Senha</label>
        <div class="input-group">
          <input id="password" [type]="showPassword() ? 'text' : 'password'" formControlName="password" autocomplete="current-password"
            placeholder="Sua senha" [attr.aria-invalid]="error('password') ? true : null" />
          <button type="button" class="btn btn-ghost btn-sm" (click)="showPassword.set(!showPassword())" [attr.aria-pressed]="showPassword()">
            {{ showPassword() ? 'Ocultar' : 'Mostrar' }}
          </button>
        </div>
        @if (error('password'); as msg) { <small class="field-error">{{ msg }}</small> }
      </div>

      @if (errorMessage(); as msg) {
        <div class="alert alert-error" role="alert">{{ msg }}</div>
      }

      <button type="submit" class="btn btn-primary btn-block" [disabled]="isLoading()">
        @if (isLoading()) { <span class="spinner" aria-hidden="true"></span> Entrando… } @else { Entrar }
      </button>
    </form>

    <div class="demo-box">
      <div class="demo-head">
        <b>Conta de demonstração</b>
        <button type="button" class="link-btn" (click)="fillDemo()">Preencher campos</button>
      </div>
      <dl>
        <dt>E-mail</dt><dd><code>{{ demo.email }}</code></dd>
        <dt>Senha</dt><dd><code>{{ demo.password }}</code></dd>
      </dl>
      <button type="button" class="btn btn-accent btn-block" (click)="useDemo()" [disabled]="isLoading()">Entrar com conta demo</button>
    </div>
  </section>
</div>
